
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b18">
<title>Space Defender</title>
<style>
  .corner-photo {
  position: fixed;
  top: 65px;
  left: 12px;
  width: 58px;
  height: 58px;
  object-fit: cover;
  border-radius: 12px;
  border: 2px solid #38bdf8;
  z-index: 9999;
  }
*{box-sizing:border-box}
body{margin:0;background:#080b18;color:#f5f7ff;font-family:Arial,sans-serif;text-align:center}
header{padding:25px 10px 12px}
h1{font-size:36px;letter-spacing:3px;margin:0}
p{color:#aab6db}
main{width:94%;max-width:480px;margin:15px auto}
.stats{display:flex;justify-content:space-around;padding:14px;background:#141d39;border-radius:12px}
canvas{display:block;width:100%;margin-top:10px;border:1px solid #34436e;border-radius:12px;touch-action:none}
button{background:#233765;color:white;border:1px solid #526bb0;border-radius:10px;padding:14px;font-size:16px}
.controls{display:flex;gap:8px;margin-top:10px}
.controls button{flex:1}
footer{margin-top:30px;padding:22px 10px;border-top:1px solid #26314d;color:#aab6db;font-size:13px;line-height:2}
footer strong{display:block;color:white;font-size:16px}
</style>
</head>
<body>
  <img src="/space-defender/IMG_20261001_233358_434.jpg" alt="Фото" class="corner-photo">
<header>
<h1>SPACE DEFENDER</h1>
<p>Защити галактику</p>
</header>
<main>
<div class="stats">
<span>Счёт: <b id="score">0</b></span>
<span>Жизни: <b id="lives">3</b></span>
</div>
<canvas id="game" width="480" height="640"></canvas>
<div class="controls">
<button id="left">◀ Влево</button>
<button id="start">Играть</button>
<button id="right">Вправо ▶</button>
</div>
<p>Удерживай кнопки, чтобы двигаться. Нажимай на игровое поле для выстрела.</p>
</main>
<footer>
<strong>Maded my Leeeemon4ik</strong>
Защищено авторским правом © 2026
</footer>

<script src="game.js"></script>
</body>
</html>
